services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=meetings_user
      - POSTGRES_PASSWORD=meetings_password
      - POSTGRES_DB=meetings_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston
    restart: always
    ports:
      - '127.0.0.1:2000:2000'
    privileged: true
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  postgres_data:
  piston_packages:
